# Runner is configured to load workflow YAML files from this directory
# instead of (or in addition to) beans discovered via CDI.
quarkus.flow.runner.enabled=true
quarkus.flow.runner.source.path=src/main/resources/workflows

# Development-only: disables Runner auth so curl-driven exploratory calls
# don't need credentials. Never do this outside a throwaway dev-mode run.
quarkus.flow.runner.security.type=NONE
